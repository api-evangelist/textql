note: >-
  app.textql.com serves four real, parsing JSON documents: an OAuth 2.1 authorization-server metadata
  document (RFC 8414), two protected-resource metadata documents (RFC 9728 — one for the resource root
  and one specifically for the /mcp endpoint), and an OpenID Connect discovery document with a live
  JWKS. The MCP endpoint's 401 carries a WWW-Authenticate header pointing at its own protected-resource
  document, which is the RFC 9728 discovery flow working end to end. docs.textql.com serves an A2A agent
  card (recorded in a2a/). No security.txt, api-catalog or ai-plugin.json is served on any host; the
  404s on textql.com and app.textql.com return the SPA HTML shell, which is a miss, not a document.
