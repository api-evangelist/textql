  model: >-
    "TextQL treats its own agent as an untrusted principal. Every query clears four gates — identity,
    entitlement, execution, audit — before a byte of your data moves."
  isolation: gVisor sandbox per session, destroyed when the session ends; no sharing between customers or between two users of the same customer
  encryption: TLS 1.2+ in transit, AES-256 at rest, customer-managed keys via customer KMS on VPC and on-prem installs
  deployment_options: [multi-tenant SaaS, single-tenant, customer VPC, BYOC, on-premises, air-gapped, private link]
  model_training: >-
    "Never trained on your data — not our models, not a provider's, with no contractual carve-out."
    Customers may bring their own Bedrock, Vertex or Azure OpenAI deployment so inference never leaves
    their account.
  identity: SAML 2.0 and OIDC (IdP- and SP-initiated), JIT provisioning, SCIM 2.0 lifecycle, domain claim enforcement, MFA enforced at the customer IdP
  authorization: >-
    Roles compose from named grants and resolve per request rather than at login. Row filters and
    column masks are evaluated by the customer's warehouse — Snowflake row access policies, Unity
    Catalog column masks, BigQuery policy tags — so revoking a grant upstream takes effect on the next
    query.
  network: gVisor-isolated sandbox per run, outbound domain allowlist, credential-injecting egress proxy, PrivateLink/VPC peering/static egress IPs on enterprise
  secrets: Credentials live in a vault the agent process cannot read.
  audit: Audit Log (AuditLogService in the Public RPC API) covers security and administrative activity
