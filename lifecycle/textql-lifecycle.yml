deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    TextQL DEPRECATES in the documentation — v1 is explicitly labelled deprecated and points at its
    replacement — but publishes no deprecation POLICY: no sunset date for v1, no stated support
    window, and no RFC 8594 Sunset or Deprecation response headers in any published spec. No
    operation in any spec carries `deprecated: true`; the deprecation is stated at the API-generation
    level in prose only. A client cannot learn from a v1 response that it is calling a deprecated API.
  deprecated_operations: []
  deprecated_operations_note: >-
    Grepped all eight published specs — zero operations flagged with the OpenAPI `deprecated` keyword,
    including every operation in the six v1 specs that the docs describe as deprecated.
