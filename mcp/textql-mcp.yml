  http_status: 401
  response_body: 'no bearer token'
  www_authenticate: >-
    Bearer resource_metadata="https://app.textql.com/.well-known/oauth-protected-resource/mcp"
  note: >-
    The live tool schemas are auth-gated. The 401 is RFC 9728-correct: it names the protected-resource
