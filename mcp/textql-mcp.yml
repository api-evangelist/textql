name: Ana MCP Server
status: published
deployment:
  mode: remote
  endpoint: https://app.textql.com/mcp
  auth: oauth
  verified: probed
x-evidence:
  fetched: '2026-08-30'
  url: https://app.textql.com/mcp
  method: POST
