  /textql.rpc.public.patches.OntologyManagementService/CreateOntologyFileUploadUrl:
    post:
      tags:
      - OntologyManagementService
      summary: Streams how many folders and files a subtree holds, so the UI can report the…
      description: 'Streams how many folders and files a subtree holds, so the UI can report the

        size of the whole Ontology rather than only the directories it has lazily

        listed. Counts rise monotonically across frames; the last frame sets

        `final`. A cache hit emits a single `final` frame with `from_cache` set.'
