components:
  schemas:
    textql.rpc.public.common.SortDirection:
      type: string
      title: SortDirection
      enum:
      - SORT_DIRECTION_UNKNOWN
      - SORT_DIRECTION_ASC
      - SORT_DIRECTION_DESC
      description: Common enum for sort direction used across multiple services
    textql.rpc.public.dashboard.Grant:
      type: object
      properties:
        roles:
          type: array
          items:
            type: string
          title: roles
          description: org role names
        members:
          type: array
          items:
            type: string
          title: members
          description: explicit member ids
      title: Grant
      additionalProperties: false
      description: "Grant is an author allowlist gating a data source or compute function. A viewer whose\n effective role names intersect roles, or whose member id is listed in members, may call it.\n Absent grant = org-visible (today's behavior); an empty grant object is invalid."
    textql.rpc.public.playbook.CancelTemplateExecutionResponse:
      type: object
      properties:
        success:
          type: boolean
          title: success
        cancelledCount:
          type: integer
          title: cancelled_count
          format: int32
          description: Number of template executions that were cancelled
      title: CancelTemplateExecutionResponse
      additionalProperties: false
      description: Response from canceling template execution
    textql.rpc.public.reports.ReportBlock:
      type: object
      oneOf:
      - type: object
        properties:
          card:
            title: card
            $ref: '#/components/schemas/textql.rpc.public.reports.CardBlock'
        title: card
        required:
        - card
      - type: object
        properties:
          divider:
            title: divider
            $ref: '#/components/schemas/textql.rpc.public.reports.DividerBlock'
        title: divider
        required:
        - divider
      - type: object
        properties:
          hero:
            title: hero
            $ref: '#/components/schemas/textql.rpc.public.reports.HeroBlock'
        title: hero
        required:
        - hero
      - type: object
        properties:
          image:
            title: image
            $ref: '#/components/schemas/textql.rpc.public.reports.ImageBlock'
        title: image
        required:
        - image
      - type: object
        properties:
          imageText:
            title: image_text
            $ref: '#/components/schemas/textql.rpc.public.reports.ImageTextBlock'
        title: image_text
        required:
        - imageText
      - type: object
        properties:
          list:
            title: list
            $ref: '#/components/schemas/textql.rpc.public.reports.ListBlock'
        title: list
        required:
        - list
