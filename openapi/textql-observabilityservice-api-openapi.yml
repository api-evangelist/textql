    textql.rpc.public.cells.EmailCell:
      type: object
      properties:
        to:
          type: array
          items:
            type: string
          title: to
          description: Inputs (set by the LLM at cell creation time)
        subject:
          type: string
          title: subject
        body:
          type: string
          title: body
          description: markdown — rendered to HTML at send time
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/textql.rpc.public.cells.EmailRecipient'
          title: recipients
          description: Resolved recipients after internal-only enforcement
        status:
          type: string
          title: status
          description: Result fields (populated by Execute) "sent" | "failed" | "blocked"
        sentAt:
          type: string
          title: sent_at
          nullable: true
        messageId:
          type: string
          title: message_id
          nullable: true
        errorMessage:
          type: string
          title: error_message
          nullable: true
        errorClass:
          type: string
          title: error_class
          description: machine-readable error category
          nullable: true
        sentCount:
          type: integer
          title: sent_count
          format: int32
          description: "Number of recipients to which the provider call succeeded during this\n Execute pass. Not derivable from Status — a partial-failure cell has\n Status=failed with sent_count > 0."
        renderedBodyHtml:
          type: string
          title: rendered_body_html
          description: "The rendered HTML body of the email — exactly what landed in inboxes,\n including the actor signature footer. The frontend's EmailCell renders\n this verbatim via {@html ...} in its preview, so a viewer sees what\n recipients saw without the FE having to repeat the render pipeline.\n Already sanitized server-side (sanitizeEmailHTML) and self-contained\n for inline use within the chat thread."
          nullable: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/textql.rpc.public.cells.EmailAttachment'
          title: attachments
      title: EmailCell
      additionalProperties: false
      description: "EmailCell is the agent's \"send an email\" output. It is an executable cell:\n the LLM emits the input (to/subject/body) and the framework executes the\n send, mutating the result fields. The cell renders as a transcript (\"Email\n sent to maya@acme.com at 2:14pm\") with the body visible after the fact."
