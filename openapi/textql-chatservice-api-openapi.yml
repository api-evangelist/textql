    textql.rpc.public.cells.EmailCell:
      type: object
      properties:
        to:
          type: array
          items:
            type: string
          title: to
          description: Inputs (set by the LLM at cell creation time)
        subject:
          type: string
          title: subject
        body:
          type: string
          title: body
          description: markdown — rendered to HTML at send time
