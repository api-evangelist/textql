components:
  schemas:
    textql.rpc.public.chat.RejectContextPromptChangeRequest:
      type: object
      properties:
        cellId:
          type: string
          title: cell_id
          description: UUID
      title: RejectContextPromptChangeRequest
      required:
      - cellId
      additionalProperties: false
      description: context prompt change management
    textql.rpc.public.chat.ArtifactType:
      type: string
      title: ArtifactType
      enum:
      - ARTIFACT_TYPE_UNKNOWN
      - ARTIFACT_TYPE_IMAGE
      - ARTIFACT_TYPE_CSV
      - ARTIFACT_TYPE_PDF
      - ARTIFACT_TYPE_HTML
      - ARTIFACT_TYPE_TEXT
      - ARTIFACT_TYPE_STREAMLIT
      - ARTIFACT_TYPE_DASHBOARD
      - ARTIFACT_TYPE_FORM
      - ARTIFACT_TYPE_REPORT
      - ARTIFACT_TYPE_AGENT
      - ARTIFACT_TYPE_HTML_CHART
      - ARTIFACT_TYPE_APP
      - ARTIFACT_TYPE_DASHBOARD_PREVIEW
      - ARTIFACT_TYPE_SKILL
      - ARTIFACT_TYPE_PATCH_DIFF
      description: Artifact types for drawer items
    textql.rpc.public.chat.ChatMessage:
      type: object
      properties:
        role:
          type: string
          title: role
        content:
          type: string
          title: content
        createdAt:
          title: created_at
          nullable: true
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: ChatMessage
      additionalProperties: false
    textql.rpc.public.cells.AnswerCell:
      type: object
      properties:
        content:
          type: string
          title: content
        images:
          type: array
          items:
            $ref: '#/components/schemas/textql.rpc.public.cells.ImageReference'
          title: images
        sql:
          type: array
          items:
            $ref: '#/components/schemas/textql.rpc.public.cells.SQLReference'
          title: sql
      title: AnswerCell
      additionalProperties: false
    textql.rpc.public.cells.FileReference:
      type: object
      properties:
        name:
          type: string
          title: name
        url:
          type: string
          title: url
        fileType:
          type: string
          title: file_type
      title: FileReference
      additionalProperties: false
    textql.rpc.public.cells.OntologyObjectDimensionLite:
      type: object
      properties:
        dimensionId:
          type: string
          title: dimension_id
        dimensionName:
          type: string
          title: dimension_name
        dimensionDescription:
          type: string
          title: dimension_description
        dimensionType:
          type: string
          title: dimension_type
      title: OntologyObjectDimensionLite
      additionalProperties: false
    textql.rpc.public.cells.TeamsUserRef:
      type: object
      properties:
        userAadId:
          type: string
          title: user_aad_id
        name:
          type: string
          title: name
      title: TeamsUserRef
      additionalProperties: false
    textql.rpc.public.chat.CheckStreamlitHealthRequest:
      type: object
      properties:
        chatId:
          type: string
          title: chat_id
        cellId:
          type: string
          title: cell_id
      title: CheckStreamlitHealthRequest
      required:
      - chatId
      - cellId
      additionalProperties: false
    textql.rpc.public.chat.FileArtifactData:
      type: object
      properties:
        url:
          type: string
          title: url
          description: Cell ID or composite "cellId:type:url" for multi-artifact cells
