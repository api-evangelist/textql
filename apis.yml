- aid: textql-public-rpc-api
  name: TextQL Public RPC API
  description: >-
    The full public Connect-RPC surface of the TextQL platform, generated from the protobuf service
    definitions and published with code samples. 407 operations across twenty services — dashboards,
    connectors, Tableau and Power BI integration, datasets, Ontology management, chat, agents, audit
    logs, MCP server registration, metrics export, observability, playbooks, RBAC, the sandbox
    services, and SCIM credential management.
  humanURL: https://docs.textql.com/api-reference/introduction
  baseURL: https://app.textql.com/rpc/public
