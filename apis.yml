- aid: textql-v2-api
  name: TextQL v2 API
  description: >-
    The REST-native second generation of the TextQL Platform API. Standard HTTP methods, resource IDs
    in the path, query-parameter filtering and cursor pagination, a plain JSON error envelope, and SSE
    streaming over text/event-stream. Covers chats with Ana, connectors, playbooks, dashboards,
    sandcastles (managed Python sandboxes), Ontology changes, members, RBAC roles and platform API keys.
  humanURL: https://docs.textql.com/api-reference/v2/introduction
