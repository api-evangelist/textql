aid: textql
name: TextQL
description: >-
  TextQL is an enterprise AI data platform built around Ana, an AI data scientist that connects to a
  company's warehouses, databases, BI tools and SaaS APIs and answers questions in plain language.
  Ana writes SQL, runs Python in a managed gVisor sandbox, searches the web, and produces charts,
  dashboards, scheduled reports (Playbooks) and long-running monitors (Agents) on top of a governed
  Ontology semantic layer. TextQL ships a public REST platform API in two generations — a v1
  Connect-RPC surface and a REST-native v2 — plus an OAuth-authorized remote MCP server that exposes
  Ana to Claude, Cursor, ChatGPT, Copilot and any MCP-compatible client. First-party TypeScript and
  Python SDKs, embeddable iframe surfaces for Ana, dashboards and data apps, SAML/OIDC single sign-on
  with SCIM 2.0 provisioning, and self-hosted Helm deployment into a customer VPC round out the
  developer surface.
