apis:
- aid: textql:textql-ana-mcp-server
  name: Ana MCP Server
  description: >-
    TextQL's hosted, remote Model Context Protocol server. Any MCP-compatible client — Claude, Claude
    Code, Cursor, Windsurf, ChatGPT, Microsoft Copilot — points at the endpoint, authorizes once over
    OAuth 2.1 with PKCE and dynamic client registration, then calls Ana headlessly against the caller's
    own connectors and Ontology. Tools are organized into scopeable groups (analysis, catalog, sandcastle,
    ontology) selectable per connection, with a dynamic mode that lets the assistant load tool groups
    on demand.
  humanURL: https://docs.textql.com/core/how-it-works/mcp/ana-as-mcp-server
  baseURL: https://app.textql.com/mcp
