observations:
- >-
  Chat is the hub. Dashboards, playbook runs and Ana's MCP answers all materialize as a chat, which is
  why the v2 spec declares no separate dashboard operations — the docs' Dashboards pages are aliases
  over the chat operations.
- >-
  Ontology writeback is the only surface with a real review state machine and optimistic concurrency.
  Everything else writes directly.
- >-
  ConnectorAccessGrant declares a group_id with no Group entity or group operation anywhere in the v2
  spec — a dangling reference an integrator cannot resolve through the published contract.
