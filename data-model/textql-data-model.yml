- name: Change
  description: >-
    A proposed Ontology change — the reviewable patch produced when a sandcastle writes back to the
    org's Ontology. States: open, denied, merged.
  key: id
  relationships:
  - type: belongs_to
    target: Member
    via: author_id
  - type: references
    target: Chat
    via: chat_id
  - type: derived_from
    target: Sandcastle
    via: v2.createOntologyChange
  state_machine:
    states: [open, denied, merged]
    transitions:
    - from: sandcastle edits
      to: open
      operation: v2.createOntologyChange
    - from: open
      to: merged
      operation: v2.approveChange
      condition: once the folder's approval rule is satisfied
    - from: open
      to: denied
      operation: v2.denyChange
    - from: denied
      to: open
      operation: v2.restoreChange
  concurrency: ExpectedGitRefBody on approve/deny/restore — optimistic concurrency against the Ontology's git ref
  operations: [v2.listChanges, v2.getChange, v2.approveChange, v2.denyChange, v2.restoreChange, v2.createOntologyChange, v2.ontologyDiff]
