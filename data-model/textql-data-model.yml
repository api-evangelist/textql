note: >-
  Relationships below are read from declared id-reference fields and $ref links in the published
  spec. Where a relationship is stated in the docs but not expressed in the schema it is marked
  source: docs so the two are not confused. TextQL publishes no id-prefix scheme — identifiers are
  plain integers or UUIDs with no type prefix, so an id is not self-describing.
id_conventions:
  prefixed: false
  note: >-
    No Stripe-style typed prefixes. Connector ids are integers (the docs' own example is
    connector_ids: [1] and `ana connector db query 7`); chats, changes and sandcastles use opaque
    string ids. An agent holding a bare id cannot tell what kind of object it points at.
