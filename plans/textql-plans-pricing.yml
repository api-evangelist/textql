observations:
- >-
  The developer-relevant capabilities are tier-gated at the top: SSO, SCIM 2.0 provisioning, private
  link, embed and white-label, and the uptime SLA are Enterprise-only. The API itself is not gated —
  the free Analyst tier can mint API keys and call the platform, paying only for the compute it uses.
- >-
  Overage gets MORE expensive on the paid tier ($3.00 per 1,000 ACU on Team vs $2.00 on Analyst)
  while the included rate is cheaper ($0.003/ACU). The Team tier buys committed volume, not a cheaper
  marginal rate.
- >-
  Pricing is published as HTML only. There is no machine-readable pricing or product-catalog
  endpoint, so plan and rate data cannot be read programmatically.
