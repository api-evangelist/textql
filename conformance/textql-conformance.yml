domain_standards:
  market: enterprise analytics / business intelligence
  note: >-
    Enterprise BI and analytics has no single machine-readable interchange standard of the kind SCIM,
    FHIR, OpenRTB or ISO 20022 provide in their markets, so there is no domain contract for TextQL to
    declare and none is invented here. The nearest thing to a domain signature on this platform is
    SCIM 2.0 for workforce identity, recorded above — and the standards TextQL consumes on the
    connector side (Snowflake row access policies, Unity Catalog column masks, BigQuery policy tags)
    are the warehouse vendors' interfaces, not a published standard TextQL conforms to. Reward-only
    dimension: recorded as not applicable rather than failed.
  declared: null
