limit_count: 0
limit_count_note: >-
  TextQL publishes NO request-rate limit — no requests-per-second, per-minute or per-day figure for
  any key, account or endpoint appears anywhere in the docs or in any of the eight published specs.
  The 429 contract is fully specified (see exhaustion below) but the threshold that triggers it is
  not. What TextQL does publish is a set of RESOURCE and TIMEOUT limits, recorded under
  organization_limits below — those are real, dated, provider-published numbers, but they cap the size
  and duration of a single operation, not the rate at which operations may be issued.
rate_limits: []
exhaustion:
  status_code: 429
  error_code: rate_limit_exceeded
  envelope: '{"error": {"code": "rate_limit_exceeded", "message": "Rate limit exceeded"}}'
  declared_on: all 55 v2 operations
  evidence: >-
    openapi/textql-v2-openapi.yml declares #/components/responses/RateLimited on every v2 operation,
    and the v2 introduction's error table lists 429 rate_limit_exceeded.
response_headers:
  published: false
  ratelimit_standard: absent
  x_ratelimit: absent
  retry_after: absent
  evidence: >-
    Grepped every published spec for RateLimit, X-RateLimit and Retry-After. The RateLimited response
    declares a JSON body only and no headers; components/headers is empty in the v2 spec. No
    rate-limit header is documented anywhere in the docs.
  agent_consequence: >-
    An agent gets a 429 with no machine-readable signal of how long to wait or how much budget
    remains. It must apply its own backoff schedule blind, and it cannot pace itself ahead of the
    limit. Publishing RateLimit-Limit/Remaining/Reset (RFC 9239-style) or a Retry-After on the 429 is
    the single cheapest runtime improvement available on this API.
